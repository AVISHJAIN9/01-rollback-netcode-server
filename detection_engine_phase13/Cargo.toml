[package]
name = "detection_engine_phase13"
version = "0.1.0"
edition = "2021"
description = "Phase XIII - Alerting & Detection Lifecycle Conclusion: Features 73-78"

[dependencies]
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
crossbeam-epoch = "0.9"

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }

[[bin]]
name = "phase13_runner"
path = "src/main.rs"

[lib]
name = "detection_engine_phase13"
path = "src/lib.rs"
